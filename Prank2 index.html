<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Breach</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:black;
    overflow:hidden;
    font-family:monospace;
    color:#00ff00;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

#terminal{
    padding:20px;
    font-size:18px;
    white-space:pre-line;
    height:100vh;
    overflow:hidden;
}

.glitch{
    animation:glitch 0.1s infinite;
}

@keyframes glitch{
    0%{transform:translate(2px,0);}
    25%{transform:translate(-2px,2px);}
    50%{transform:translate(2px,-2px);}
    75%{transform:translate(-2px,0);}
    100%{transform:translate(0,0);}
}

#warning{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    display:none;
}

#warning h1{
    color:red;
    font-size:60px;
    text-shadow:0 0 20px red;
}

#warning p{
    color:white;
    font-size:24px;
    margin-top:10px;
}

#countdown{
    color:red;
    font-size:70px;
    margin-top:20px;
}

.flash{
    animation:flash 0.2s infinite;
}

@keyframes flash{
    50%{
        background:red;
    }
}

.fake-popup{
    position:absolute;
    background:#111;
    border:2px solid red;
    color:white;
    padding:15px;
    width:250px;
    box-shadow:0 0 20px red;
    animation:popup 0.3s;
}

@keyframes popup{
    from{
        transform:scale(0);
    }
    to{
        transform:scale(1);
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="terminal"></div>

<div id="warning">
    <h1 class="glitch">SYSTEM HACKED</h1>
    <p>Hacked Your Device  😈</p>
    <div id="countdown">10</div>
</div>

<audio id="beep">
<source src="https://www.soundjay.com/button/beep-07.wav" type="audio/wav">
</audio>

<script>

const terminal = document.getElementById("terminal");

const lines = [
"Connecting to encrypted server...",
"Accessing hidden database...",
"Firewall bypassed...",
"Collecting device information...",
"Injecting  payload...",
"Decrypting files...",
"Uploading memes...",
"System override completed..."
];

let i = 0;

function typeLine(){
    if(i < lines.length){
        terminal.innerHTML += "> " + lines[i] + "\n";
        i++;

        if(navigator.vibrate){
            navigator.vibrate(100);
        }

        setTimeout(typeLine, 900);

    }else{
        showWarning();
    }
}

typeLine();

function showWarning(){

    document.body.classList.add("flash");

    document.getElementById("warning").style.display = "block";

    createPopups();

    let count = 10;

    const countdown = document.getElementById("countdown");

    const interval = setInterval(()=>{

        count--;
        countdown.innerText = count;

        if(navigator.vibrate){
            navigator.vibrate([200,100,200]);
        }

        if(count <= 0){
            clearInterval(interval);

            document.body.innerHTML = `
            <div style="
                display:flex;
                justify-content:center;
                align-items:center;
                height:100vh;
                flex-direction:column;
                color:white;
                background:black;
                text-align:center;
                font-family:monospace;
            ">
                <h1 style="font-size:70px;color:#00ff00;">
                    😂 GOT YOU!
                </h1>

                <p style="font-size:28px;margin-top:20px;">
                    This was just a harmless prank website.
                </p>
            </div>
            `;
        }

    },1000);
}

function createPopups(){

    setInterval(()=>{

        const popup = document.createElement("div");

        popup.className = "fake-popup";

        popup.style.left = Math.random()*window.innerWidth + "px";
        popup.style.top = Math.random()*window.innerHeight + "px";

        popup.innerHTML = `
        WARNING!<br>
        Suspicious activity detected.
        `;

        document.body.appendChild(popup);

        setTimeout(()=>{
            popup.remove();
        },2000);

    },500);
}

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
const columns = canvas.width / fontSize;

const drops = [];

for(let x = 0; x < columns; x++){
    drops[x] = 1;
}

function draw(){

    ctx.fillStyle = "rgba(0,0,0,0.05)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "#0F0";
    ctx.font = fontSize + "px monospace";

    for(let i = 0; i < drops.length; i++){

        const text = letters[Math.floor(Math.random()*letters.length)];

        ctx.fillText(text, i*fontSize, drops[i]*fontSize);

        if(drops[i]*fontSize > canvas.height && Math.random() > 0.975){
            drops[i] = 0;
        }

        drops[i]++;
    }
}

setInterval(draw,33);

</script>

</body>
</html>
